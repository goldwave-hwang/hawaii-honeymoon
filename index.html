const LINK_CONFIG = Object.freeze({
  apiKey: 'AIzaSyDnDQIVYJD_O2P5RGDkknQWwTHrdy1Q_KU',
  authDomain: 'hawaii-honeymoon-36d45.firebaseapp.com',

function usesLinkConfig(config) {
  return Object.keys(LINK_CONFIG).every(key => config?.[key] === LINK_CONFIG[key]);
}
function encodeLink(config, id) {
  if (usesLinkConfig(config) && validPlan(id)) {
    return location.origin + location.pathname + '#p=' + id;
  }
  const payload = btoa(JSON.stringify({config, id})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin + location.pathname + '#share=' + payload;
}
function parseLink() {
  const short = location.hash.match(/^#p=([a-f0-9]{32})$/);
  if (short) return {config: {...LINK_CONFIG}, id: short[1]};
  const match = location.hash.match(/^#share=([\w-]+)$/);
  if (!match) return null;
  try {
    const raw = match[1].replace(/-/g,'+').replace(/_/g,'/');
    const item = JSON.parse(atob(raw));
    return validPlan(item.id) && validateConfig(item.config) ? item : null;
  } catch { return null; }
}
function validateConfig(config) {
  return config && ['apiKey','authDomain','projectId','appId'].every(k => typeof config[k] === 'string' && config[k].trim());
}
function parseConfig(raw) {
  // The console supplies a JavaScript object; accept that form as well as plain JSON.
  const body = raw.slice(raw.indexOf('{'), raw.lastIndexOf('}')+1)
    .replace(/([,{]\s*)([a-zA-Z]\w*)\s*:/g, '$1"$2":')
    .replace(/'/g,'"').replace(/,\s*}/g,'}');
  const config = JSON.parse(body);
  if (!validateConfig(config)) throw new Error('Firebase 웹 앱 설정의 apiKey, authDomain, projectId, appId를 확인해 주세요.');
  return config;
}

    <p class="sync-help">이 링크를 받은 사람은 일정 내용을 볼 수 있으므로 필요한 사람에게만 보내세요.</p><p id="sync-error" class="dialog-error"></p>`;

function showError(error) {
  connectionError = '공유 연결 오류 · 이 기기에만 저장됨';
  setPermissions();
  const el=document.getElementById('sync-error');
  if (el) el.textContent = typeof error === 'string' ? error : (error?.message || String(error));
}
function normalizedRemote(state) {
  if (!state || !Array.isArray(state.days) || state.days.length !== 12 ||
      !Array.isArray(state.booking) || !Array.isArray(state.packing)) throw new Error('공유 일정 형식이 올바르지 않습니다.');
  return JSON.parse(JSON.stringify(state));
}
function applyOp(state, op) {
  if (op.type.startsWith('day-')) {
    const entries=state.days[op.day]?.entries;
    if (!entries) return;
    const index=entries.findIndex(e=>e.id===op.id);
    if (op.type==='day-add' && !entries.some(e=>e.id===op.entry.id)) { const position=entries.findIndex(e=>e.id===op.beforeId); entries.splice(position<0?entries.length:position,0,op.entry); }
    if (op.type==='day-move' && index>=0 && op.id!==op.beforeId) { const [entry]=entries.splice(index,1); const position=entries.findIndex(e=>e.id===op.beforeId); entries.splice(position<0?entries.length:position,0,entry); }
    if (op.type==='day-edit' && index>=0) entries[index].text=op.text;
    if (op.type==='day-delete' && index>=0) entries.splice(index,1);
    return;
  }
  const groups=state[op.kind]; if (!Array.isArray(groups)) return;
  const index=groups.findIndex(g=>g.id===op.id || g.id===op.groupId);
  if (op.type==='group-add') { if (!groups.some(g=>g.id===op.group.id)) groups.push(op.group); return; }
  if (index<0) return;
  const group=groups[index];
  if (op.type==='group-delete') groups.splice(index,1);
  if (op.type==='group-name') group.name=op.name;
  if (op.type==='item-add' && !group.items.some(i=>i.id===op.item.id)) group.items.push(op.item);
  const itemIndex=group.items.findIndex(i=>i.id===op.id);
  if (op.type==='item-delete' && itemIndex>=0) group.items.splice(itemIndex,1);
  if (op.type==='item-text' && itemIndex>=0) group.items[itemIndex].text=op.text;
  if ((op.type==='packing-check'||op.type==='packing-status'&&['pending','packed','na'].includes(op.status)) && op.kind==='packing' && itemIndex>=0 && ['injae','boyeon'].includes(op.person)) { const item=group.items[itemIndex]; item.doneBy={injae:item.doneBy?.injae==='na'?false:typeof item.doneBy?.injae==='boolean'?item.doneBy.injae:!!item.done,boyeon:item.doneBy?.boyeon==='na'?false:typeof item.doneBy?.boyeon==='boolean'?item.doneBy.boyeon:!!item.done}; item.doneBy[op.person]=op.type==='packing-status'?(op.status==='packed'):!!op.done; item.done=item.doneBy.injae!==false&&item.doneBy.boyeon!==false; }
  if (op.type==='item-done' && itemIndex>=0) group.items[itemIndex].done=op.done;
}
function backupLocal() {
  const key=planner.key+'-before-share-'+connection.id;
  if (!localStorage.getItem(key)) localStorage.setItem(key,JSON.stringify(planner.getState()));
}
function acceptCloud() {
  if (!cloudDoc || queue.length || busy || ui.dialog.open && document.getElementById('entry-draft')) return;
  const active=document.activeElement;
  if (active?.matches?.('.group-title input, .row input.field, .packing-tick, #entry-draft')) return;

  setPermissions();
}
async function flush() {
  if (!navigator.onLine || busy || !queue.length || !planRef || !isEditor()) { setPermissions(); return; }
  busy=true;setPermissions();
  while (queue.length && planRef && isEditor()) {
    const op=queue[0];
    try {
      const merged=await sdk.runTransaction(db, async tx=>{
        const snapshot=await tx.get(planRef);
        if (!snapshot.exists()) throw new Error('공유 일정이 없습니다.');
        const state=normalizedRemote(snapshot.data().state);
        applyOp(state,op);
        tx.update(planRef,{state,updatedAt:sdk.serverTimestamp()});
        return state;
      });
      cloudDoc.state=merged;cacheSnapshot();
      queue.shift();localStorage.setItem(QUEUE_KEY+connection.id,JSON.stringify(queue));
      connectionError='';
    } catch(error) {showError(error);break;}
  }
  busy=false;setPermissions();acceptCloud();
}
async function loadSdk(config) {
  const version='12.19.0';
  const [appModule,authModule,dbModule]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${version}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${version}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${version}/firebase-firestore.js`)
  ]);
  sdk={...authModule,...dbModule};
  const app=appModule.initializeApp(config);
  auth=authModule.getAuth(app);db=dbModule.getFirestore(app);
  authModule.onAuthStateChanged(auth,()=>{setPermissions();syncMenu();flush();});

async function connect(next) {
  if (!validateConfig(next.config)) throw new Error('Firebase 설정을 확인해 주세요.');
  if (connection?.id && unsubscribe) unsubscribe();
  connection=next;cloudDoc=null;connectionError='';
  localStorage.setItem(CONFIG_KEY,JSON.stringify(connection));
  if (validPlan(connection.id)) {
    history.replaceState(history.state, '', encodeLink(connection.config, connection.id));
  }
  setPermissions();syncMenu();
  savedSnapshot=null;
  if (connection.id) {
    try { savedSnapshot=JSON.parse(localStorage.getItem(snapshotKey(connection.id))||'null');if(savedSnapshot) planner.acceptRemote(normalizedRemote(savedSnapshot.state)); } catch { savedSnapshot=null; }
    if (!savedSnapshot) planner.acceptRemote({days:planner.getState().days.map(d=>({...d,entries:[]})),booking:[],packing:[]});
  }
  setPermissions();
  if (!navigator.onLine) return;
  if (!sdk) await loadSdk(connection.config);
  if (!connection.id) return;
  planRef=sdk.doc(db,'plans',connection.id);
  queue=JSON.parse(localStorage.getItem(QUEUE_KEY+connection.id)||'[]');
  unsubscribe=sdk.onSnapshot(planRef,snapshot=>{
    if (!snapshot.exists()) {showError('공유 일정이 없습니다. 링크를 다시 확인해 주세요.');return;}

    try {cloudDoc={state:normalizedRemote(item.state),editorEmails:item.editorEmails||[]};}
    catch(error){showError(error);return;}
    cacheSnapshot();connectionError='';setPermissions();acceptCloud();syncMenu();flush();
  },showError);
}
window.addEventListener('hawaii-change',event=>{
  if (!connection?.id || !isEditor()) return;
  const op=event.detail;
  const isText=['group-name','item-text'].includes(op.type);
  const last=queue.at(-1);
  if(isText && last?.type===op.type && last.id===op.id && last.groupId===op.groupId) queue[queue.length-1]=op;
  else queue.push(op);
  localStorage.setItem(QUEUE_KEY+connection.id,JSON.stringify(queue));
  setPermissions();

  debounceTimer=setTimeout(flush,isText?450:0);
});

});

ui.dialog.addEventListener('click',async event=>{
  const action=event.target.closest('button')?.dataset.sync;
  if (!action) return;
  if (!navigator.onLine && action!=='copy') {document.getElementById('sync-error').textContent='인터넷 연결 후 이용해 주세요.';return;}

      const config=parseConfig(document.getElementById('firebase-config').value);
      await connect({config,id:null});

      const partner=document.getElementById('partner-email').value.trim().toLowerCase();

      const bytes=crypto.getRandomValues(new Uint8Array(16));
